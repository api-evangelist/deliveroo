apis:
- aid: deliveroo:catalogue-api
  name: Deliveroo Catalogue API
  tags:
  - Catalogue
  - Grocery
  - Retail
  - Products
  - Inventory
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://api-docs.deliveroo.com/v2.0/docs
  baseURL: https://api.developers.deliveroo.com
  description: >-
    The Deliveroo Catalogue API is part of the Retail Platform Suite and manages master grocery catalogues
    of up to 30,000 items per merchant. Retailers use it to publish product data, variations, and availability
    across one or more retail sites operating on Deliveroo.
  properties:
  - type: Documentation
    url: https://api-docs.deliveroo.com/v2.0/docs
  - type: OpenAPI
    url: openapi/deliveroo-catalogue-api-openapi.yml
- aid: deliveroo:picking-api
  name: Deliveroo Picking API
  tags:
  - Picking
  - Grocery
  - Retail
  - Order Fulfillment
  - Substitutions
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://api-docs.deliveroo.com/v2.0/docs
  baseURL: https://api.developers.deliveroo.com
  description: >-
    The Deliveroo Picking API supports the Retail Platform Suite picking flow, letting grocery operators
    process incoming orders, remove unavailable items, propose substitutions, and accept or reject orders
    prior to handoff to a courier.
  properties:
