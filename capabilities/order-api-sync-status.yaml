    authentication:
      type: bearer
      token: '{{env.DELIVEROO_ACCESS_TOKEN}}'
    resources:
    - name: order-v1-orders-order-id-sync-status
      path: /order/v1/orders/{order_id}/sync_status
      operations:
      - name: createSyncStatus
        method: POST
        description: Deliveroo Create Sync Status for an Order
        inputParameters:
        - name: order_id
          in: path
          type: string
          required: true
          description: The unique identifier of the Deliveroo order.
        - name: body
          in: body
          type: object
          required: true
          description: Request body payload.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
