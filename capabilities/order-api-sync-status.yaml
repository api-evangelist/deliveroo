      name: order-v1-orders-order-id-sync-status
      description: REST surface for Deliveroo Create Sync Status for an Order.
      operations:
      - method: POST
        name: createSyncStatus
        description: REST surface for Deliveroo Create Sync Status for an Order.
        call: order-api-sync-status.createSyncStatus
        with:
          order_id: rest.order_id
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
