    port: 9090
    transport: http
    description: MCP adapter for Deliveroo Order API — Sync Status. One tool per consumed operation, routed inline through this capability's consumes block.
    tools:
    - name: create-sync-status-order
      description: Deliveroo Create Sync Status for an Order
      hints:
        readOnly: false
        destructive: false
        idempotent: false
