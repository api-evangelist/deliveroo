naftiko: 1.0.0-alpha2
info:
  label: Deliveroo Catalogue API — Pricing
  description: 'Catalogue API — Pricing. 1 operations. Lead operation: Deliveroo Update Prices Per Site. Self-contained Naftiko capability covering one Deliveroo business surface.'
  tags:
  - Deliveroo
  - Catalogue
  - Pricing
  created: '2026-06-02'
  modified: '2026-06-02'
binds:
- namespace: env
  keys:
    DELIVEROO_ACCESS_TOKEN: DELIVEROO_ACCESS_TOKEN
capability:
  consumes:
  - type: http
    namespace: catalogue-api-pricing
    baseUri: https://api.developers.deliveroo.com
    description: Deliveroo Catalogue API — Pricing business capability. Self-contained, no shared references.
    authentication:
      type: bearer
      token: '{{env.DELIVEROO_ACCESS_TOKEN}}'
    resources:
    - name: brands-brand-id-catalogue-catalogue-id-sites-site-id-prices
      path: /brands/{brand_id}/catalogue/{catalogue_id}/sites/{site_id}/prices
      operations:
      - name: updatePricesPerSite
        method: PUT
        description: Deliveroo Update Prices Per Site
        inputParameters:
        - name: brand_id
          in: path
          type: string
          required: true
          description: The brand identifier.
        - name: catalogue_id
          in: path
          type: string
          required: true
          description: The catalogue identifier.
        - name: site_id
          in: path
          type: string
          required: true
          description: The site identifier whose prices are being overridden.
        - name: body
          in: body
          type: object
          required: true
          description: Request body payload.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    namespace: catalogue-api-pricing-rest
    port: 8080
    description: REST adapter for Deliveroo Catalogue API — Pricing. One Spectral-compliant resource per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/brands-brand-id-catalogue-catalogue-id-sites-site-id-prices
      name: brands-brand-id-catalogue-catalogue-id-sites-site-id-prices
      description: REST surface for Deliveroo Update Prices Per Site.
      operations:
      - method: PUT
        name: updatePricesPerSite
        description: REST surface for Deliveroo Update Prices Per Site.
        call: catalogue-api-pricing.updatePricesPerSite
        with:
          brand_id: rest.brand_id
          catalogue_id: rest.catalogue_id
          site_id: rest.site_id
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: catalogue-api-pricing-mcp
    port: 9090
    transport: http
    description: MCP adapter for Deliveroo Catalogue API — Pricing. One tool per consumed operation, routed inline through this capability's consumes block.
    tools:
    - name: update-prices-per-site
      description: Deliveroo Update Prices Per Site
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: catalogue-api-pricing.updatePricesPerSite
      with:
        brand_id: tools.brand_id
        catalogue_id: tools.catalogue_id
        site_id: tools.site_id
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
