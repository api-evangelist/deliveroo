naftiko: 1.0.0-alpha2
info:
  label: Deliveroo Signature API — Quotes
  description: 'Signature API — Quotes. 1 operations. Lead operation: Deliveroo Create Quote. Self-contained Naftiko capability covering one Deliveroo business surface.'
  tags:
  - Deliveroo
  - Signature
  - Quotes
  created: '2026-06-02'
  modified: '2026-06-02'
binds:
- namespace: env
  keys:
    DELIVEROO_ACCESS_TOKEN: DELIVEROO_ACCESS_TOKEN
capability:
  consumes:
  - type: http
    namespace: signature-api-quotes
    baseUri: https://api.developers.deliveroo.com
    description: Deliveroo Signature API — Quotes business capability. Self-contained, no shared references.
    authentication:
      type: bearer
      token: '{{env.DELIVEROO_ACCESS_TOKEN}}'
    resources:
    - name: signature-v1-quotes
      path: /signature/v1/quotes
      operations:
      - name: createQuote
        method: POST
        description: Deliveroo Create Quote
        inputParameters:
        - name: body
          in: body
          type: object
          required: true
          description: Request body payload.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    namespace: signature-api-quotes-rest
    port: 8080
    description: REST adapter for Deliveroo Signature API — Quotes. One Spectral-compliant resource per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/signature-v1-quotes
      name: signature-v1-quotes
      description: REST surface for Deliveroo Create Quote.
      operations:
      - method: POST
        name: createQuote
        description: REST surface for Deliveroo Create Quote.
        call: signature-api-quotes.createQuote
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: signature-api-quotes-mcp
    port: 9090
    transport: http
    description: MCP adapter for Deliveroo Signature API — Quotes. One tool per consumed operation, routed inline through this capability's consumes block.
    tools:
    - name: create-quote
      description: Deliveroo Create Quote
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: signature-api-quotes.createQuote
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
