naftiko: 1.0.0-alpha2
info:
  label: Deliveroo Picking API — Picking
  description: 'Picking API — Picking. 5 operations. Lead operation: Deliveroo Fetch Active Orders. Self-contained Naftiko capability covering one Deliveroo business surface.'
  tags:
  - Deliveroo
  - Picking
  - Picking
  created: '2026-06-02'
  modified: '2026-06-02'
binds:
- namespace: env
  keys:
    DELIVEROO_ACCESS_TOKEN: DELIVEROO_ACCESS_TOKEN
capability:
  consumes:
  - type: http
    namespace: picking-api-picking
    baseUri: https://api.developers.deliveroo.com
    description: Deliveroo Picking API — Picking business capability. Self-contained, no shared references.
    authentication:
      type: bearer
      token: '{{env.DELIVEROO_ACCESS_TOKEN}}'
    resources:
    - name: picking-v1-sites-restaurant-id-orders-active
      path: /picking/v1/sites/{restaurant_id}/orders/active
      operations:
      - name: getActiveOrders
        method: GET
        description: Deliveroo Fetch Active Orders
        inputParameters:
        - name: restaurant_id
          in: path
          type: string
          required: true
          description: The site (restaurant) identifier.
        - name: page
          in: query
          type: integer
          required: true
          description: The zero-based page index.
        - name: per_page
          in: query
          type: integer
          required: true
          description: The number of orders per page.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: picking-v1-orders-order-id-accept
      path: /picking/v1/orders/{order_id}/accept
      operations:
      - name: acceptPickingOrder
        method: PUT
        description: Deliveroo Accept Order
        inputParameters:
        - name: order_id
          in: path
          type: string
          required: true
          description: The unique identifier of the order.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: picking-v1-orders-order-id-reject
      path: /picking/v1/orders/{order_id}/reject
      operations:
      - name: rejectPickingOrder
        method: PUT
        description: Deliveroo Reject Order
        inputParameters:
        - name: order_id
          in: path
          type: string
          required: true
          description: The unique identifier of the order.
        - name: body
          in: body
          type: object
          required: true
          description: Request body payload.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: picking-v1-orders-order-id-start-picking
      path: /picking/v1/orders/{order_id}/start_picking
      operations:
      - name: startPicking
        method: PUT
        description: Deliveroo Start Picking Process for Order
        inputParameters:
        - name: order_id
          in: path
          type: string
          required: true
          description: The unique identifier of the order.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: picking-v2-orders-order-id
      path: /picking/v2/orders/{order_id}
      operations:
      - name: updateOrderItems
        method: PUT
        description: Deliveroo Update Order Items Availability
        inputParameters:
        - name: order_id
          in: path
          type: string
          required: true
          description: The unique identifier of the order.
        - name: body
          in: body
          type: object
          required: true
          description: Request body payload.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    namespace: picking-api-picking-rest
    port: 8080
    description: REST adapter for Deliveroo Picking API — Picking. One Spectral-compliant resource per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/picking-v1-sites-restaurant-id-orders-active
      name: picking-v1-sites-restaurant-id-orders-active
      description: REST surface for Deliveroo Fetch Active Orders.
      operations:
      - method: GET
        name: getActiveOrders
        description: REST surface for Deliveroo Fetch Active Orders.
        call: picking-api-picking.getActiveOrders
        with:
          restaurant_id: rest.restaurant_id
          page: rest.page
          per_page: rest.per_page
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/picking-v1-orders-order-id-accept
      name: picking-v1-orders-order-id-accept
      description: REST surface for Deliveroo Accept Order.
      operations:
      - method: PUT
        name: acceptPickingOrder
        description: REST surface for Deliveroo Accept Order.
        call: picking-api-picking.acceptPickingOrder
        with:
          order_id: rest.order_id
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/picking-v1-orders-order-id-reject
      name: picking-v1-orders-order-id-reject
      description: REST surface for Deliveroo Reject Order.
      operations:
      - method: PUT
        name: rejectPickingOrder
        description: REST surface for Deliveroo Reject Order.
        call: picking-api-picking.rejectPickingOrder
        with:
          order_id: rest.order_id
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/picking-v1-orders-order-id-start-picking
      name: picking-v1-orders-order-id-start-picking
      description: REST surface for Deliveroo Start Picking Process for Order.
      operations:
      - method: PUT
        name: startPicking
        description: REST surface for Deliveroo Start Picking Process for Order.
        call: picking-api-picking.startPicking
        with:
          order_id: rest.order_id
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/picking-v2-orders-order-id
      name: picking-v2-orders-order-id
      description: REST surface for Deliveroo Update Order Items Availability.
      operations:
      - method: PUT
        name: updateOrderItems
        description: REST surface for Deliveroo Update Order Items Availability.
        call: picking-api-picking.updateOrderItems
        with:
          order_id: rest.order_id
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: picking-api-picking-mcp
    port: 9090
    transport: http
    description: MCP adapter for Deliveroo Picking API — Picking. One tool per consumed operation, routed inline through this capability's consumes block.
    tools:
    - name: fetch-active-orders
      description: Deliveroo Fetch Active Orders
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: picking-api-picking.getActiveOrders
      with:
        restaurant_id: tools.restaurant_id
        page: tools.page
        per_page: tools.per_page
      outputParameters:
      - type: object
        mapping: $.
    - name: accept-order
      description: Deliveroo Accept Order
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: picking-api-picking.acceptPickingOrder
      with:
        order_id: tools.order_id
      outputParameters:
      - type: object
        mapping: $.
    - name: reject-order
      description: Deliveroo Reject Order
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: picking-api-picking.rejectPickingOrder
      with:
        order_id: tools.order_id
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: start-picking-process-order
      description: Deliveroo Start Picking Process for Order
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: picking-api-picking.startPicking
      with:
        order_id: tools.order_id
      outputParameters:
      - type: object
        mapping: $.
    - name: update-order-items-availability
      description: Deliveroo Update Order Items Availability
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: picking-api-picking.updateOrderItems
      with:
        order_id: tools.order_id
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
