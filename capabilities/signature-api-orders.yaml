naftiko: 1.0.0-alpha2
info:
  label: Deliveroo Signature API — Orders
  description: 'Signature API — Orders. 1 operations. Lead operation: Deliveroo Create a New Order. Self-contained Naftiko capability covering one Deliveroo business surface.'
  tags:
  - Deliveroo
  - Signature
  - Orders
  created: '2026-06-02'
  modified: '2026-06-02'
binds:
- namespace: env
  keys:
    DELIVEROO_ACCESS_TOKEN: DELIVEROO_ACCESS_TOKEN
capability:
  consumes:
  - type: http
    namespace: signature-api-orders
    baseUri: https://api.developers.deliveroo.com
    description: Deliveroo Signature API — Orders business capability. Self-contained, no shared references.
    authentication:
      type: bearer
      token: '{{env.DELIVEROO_ACCESS_TOKEN}}'
    resources:
    - name: signature-v1-orders
      path: /signature/v1/orders
      operations:
      - name: createOrder
        method: POST
        description: Deliveroo Create a New Order
        inputParameters:
        - name: body
          in: body
          type: object
          required: true
          description: Request body payload.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    namespace: signature-api-orders-rest
    port: 8080
    description: REST adapter for Deliveroo Signature API — Orders. One Spectral-compliant resource per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/signature-v1-orders
      name: signature-v1-orders
      description: REST surface for Deliveroo Create a New Order.
      operations:
      - method: POST
        name: createOrder
        description: REST surface for Deliveroo Create a New Order.
        call: signature-api-orders.createOrder
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: signature-api-orders-mcp
    port: 9090
    transport: http
    description: MCP adapter for Deliveroo Signature API — Orders. One tool per consumed operation, routed inline through this capability's consumes block.
    tools:
    - name: create-new-order
      description: Deliveroo Create a New Order
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: signature-api-orders.createOrder
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
