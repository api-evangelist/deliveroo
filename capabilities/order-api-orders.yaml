naftiko: 1.0.0-alpha2
info:
  label: Deliveroo Order API — Orders
  description: 'Order API — Orders. 1 operations. Lead operation: Deliveroo Update Order Status. Self-contained Naftiko capability covering one Deliveroo business surface.'
  tags:
  - Deliveroo
  - Order
  - Orders
  created: '2026-06-02'
  modified: '2026-06-02'
binds:
- namespace: env
  keys:
    DELIVEROO_ACCESS_TOKEN: DELIVEROO_ACCESS_TOKEN
capability:
  consumes:
  - type: http
    namespace: order-api-orders
    baseUri: https://api.developers.deliveroo.com
    description: Deliveroo Order API — Orders business capability. Self-contained, no shared references.
    authentication:
      type: bearer
      token: '{{env.DELIVEROO_ACCESS_TOKEN}}'
    resources:
    - name: order-v1-orders-order-id
      path: /order/v1/orders/{order_id}
      operations:
      - name: updateOrderStatus
        method: PATCH
        description: Deliveroo Update Order Status
        inputParameters:
        - name: order_id
          in: path
          type: string
          required: true
          description: The unique identifier of the Deliveroo order.
        - name: body
          in: body
          type: object
          required: true
          description: Request body payload.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    namespace: order-api-orders-rest
    port: 8080
    description: REST adapter for Deliveroo Order API — Orders. One Spectral-compliant resource per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/order-v1-orders-order-id
      name: order-v1-orders-order-id
      description: REST surface for Deliveroo Update Order Status.
      operations:
      - method: PATCH
        name: updateOrderStatus
        description: REST surface for Deliveroo Update Order Status.
        call: order-api-orders.updateOrderStatus
        with:
          order_id: rest.order_id
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: order-api-orders-mcp
    port: 9090
    transport: http
    description: MCP adapter for Deliveroo Order API — Orders. One tool per consumed operation, routed inline through this capability's consumes block.
    tools:
    - name: update-order-status
      description: Deliveroo Update Order Status
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: order-api-orders.updateOrderStatus
      with:
        order_id: tools.order_id
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
