naftiko: 1.0.0-alpha2
info:
  label: Deliveroo Signature API — Deliveries
  description: 'Signature API — Deliveries. 1 operations. Lead operation: Deliveroo Schedule Delivery. Self-contained Naftiko capability covering one Deliveroo business surface.'
  tags:
  - Deliveroo
  - Signature
  - Deliveries
  created: '2026-06-02'
  modified: '2026-06-02'
binds:
- namespace: env
  keys:
    DELIVEROO_ACCESS_TOKEN: DELIVEROO_ACCESS_TOKEN
capability:
  consumes:
  - type: http
    namespace: signature-api-deliveries
    baseUri: https://api.developers.deliveroo.com
    description: Deliveroo Signature API — Deliveries business capability. Self-contained, no shared references.
    authentication:
      type: bearer
      token: '{{env.DELIVEROO_ACCESS_TOKEN}}'
    resources:
    - name: daas-v1-deliveries
      path: /daas/v1/deliveries
      operations:
      - name: scheduleDelivery
        method: POST
        description: Deliveroo Schedule Delivery
        inputParameters:
        - name: body
          in: body
          type: object
          required: true
          description: Request body payload.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    namespace: signature-api-deliveries-rest
    port: 8080
    description: REST adapter for Deliveroo Signature API — Deliveries. One Spectral-compliant resource per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/daas-v1-deliveries
      name: daas-v1-deliveries
      description: REST surface for Deliveroo Schedule Delivery.
      operations:
      - method: POST
        name: scheduleDelivery
        description: REST surface for Deliveroo Schedule Delivery.
        call: signature-api-deliveries.scheduleDelivery
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: signature-api-deliveries-mcp
    port: 9090
    transport: http
    description: MCP adapter for Deliveroo Signature API — Deliveries. One tool per consumed operation, routed inline through this capability's consumes block.
    tools:
    - name: schedule-delivery
      description: Deliveroo Schedule Delivery
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: signature-api-deliveries.scheduleDelivery
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
