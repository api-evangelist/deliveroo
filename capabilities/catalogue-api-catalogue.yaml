naftiko: 1.0.0-alpha2
info:
  label: Deliveroo Catalogue API — Catalogue
  description: 'Catalogue API — Catalogue. 1 operations. Lead operation: Deliveroo Get Catalogue. Self-contained Naftiko capability covering one Deliveroo business surface.'
  tags:
  - Deliveroo
  - Catalogue
  - Catalogue
  created: '2026-06-02'
  modified: '2026-06-02'
binds:
- namespace: env
  keys:
    DELIVEROO_ACCESS_TOKEN: DELIVEROO_ACCESS_TOKEN
capability:
  consumes:
  - type: http
    namespace: catalogue-api-catalogue
    baseUri: https://api.developers.deliveroo.com
    description: Deliveroo Catalogue API — Catalogue business capability. Self-contained, no shared references.
    authentication:
      type: bearer
      token: '{{env.DELIVEROO_ACCESS_TOKEN}}'
    resources:
    - name: brands-brand-id-catalogue-catalogue-id
      path: /brands/{brand_id}/catalogue/{catalogue_id}
      operations:
      - name: getCatalogue
        method: GET
        description: Deliveroo Get Catalogue
        inputParameters:
        - name: brand_id
          in: path
          type: string
          required: true
          description: The brand identifier.
        - name: catalogue_id
          in: path
          type: string
          required: true
          description: The catalogue identifier.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    namespace: catalogue-api-catalogue-rest
    port: 8080
    description: REST adapter for Deliveroo Catalogue API — Catalogue. One Spectral-compliant resource per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/brands-brand-id-catalogue-catalogue-id
      name: brands-brand-id-catalogue-catalogue-id
      description: REST surface for Deliveroo Get Catalogue.
      operations:
      - method: GET
        name: getCatalogue
        description: REST surface for Deliveroo Get Catalogue.
        call: catalogue-api-catalogue.getCatalogue
        with:
          brand_id: rest.brand_id
          catalogue_id: rest.catalogue_id
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: catalogue-api-catalogue-mcp
    port: 9090
    transport: http
    description: MCP adapter for Deliveroo Catalogue API — Catalogue. One tool per consumed operation, routed inline through this capability's consumes block.
    tools:
    - name: get-catalogue
      description: Deliveroo Get Catalogue
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: catalogue-api-catalogue.getCatalogue
      with:
        brand_id: tools.brand_id
        catalogue_id: tools.catalogue_id
      outputParameters:
      - type: object
        mapping: $.
